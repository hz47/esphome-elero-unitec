# RSSI PEAK-HOLD METER - samples continuously so it cannot miss a short burst.
# Flash, open Logs, then HOLD a remote button down (right on the copper coil) for
# several seconds.
#   quiet  -> peak sits around -85 to -100 dBm
#   SIGNAL -> peak jumps to roughly -20 to -65 dBm => antenna + receiver WORK
# If it stays near -90 even while HOLDING the remote on the coil -> receive path dead.

esphome:
  name: esp-milos
  friendly_name: esp-milos
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(cc).enable(); id(cc).transfer_byte(0x30); id(cc).disable();   // SRES
          delay(5);
          const uint8_t regs[][2] = {
            {0x0B,0x08},{0x0C,0x00},
            {0x0D,0x21},{0x0E,0x71},{0x0F,0x7A},   // FREQ2/1/0 = 868.3 MHz
            {0x10,0x7B},{0x11,0x83},{0x12,0x13},{0x13,0x52},{0x14,0xF8},
            {0x0A,0x00},{0x15,0x43},{0x21,0xB6},{0x22,0x10},
            {0x18,0x18},{0x17,0x3F},{0x19,0x1D},{0x1A,0x1F},
            {0x1B,0xC7},{0x1C,0x00},{0x1D,0xB2},
            {0x23,0xEA},{0x24,0x2A},{0x25,0x00},{0x26,0x1F},
            {0x29,0x59},{0x2C,0x81},{0x2D,0x35},{0x2E,0x09},
            {0x02,0x06},{0x07,0x8C},{0x08,0x45},{0x09,0x00},
            {0x06,0x3C},{0x04,0xD3},{0x05,0x91}
          };
          for (auto &r : regs) {
            id(cc).enable(); id(cc).transfer_byte(r[0]); id(cc).transfer_byte(r[1]); id(cc).disable();
            delayMicroseconds(20);
          }
          id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();   // SRX
          ESP_LOGI("rssi", "RX armed. HOLD a remote button on the copper coil for a few seconds.");

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  interface: software

spi_device:
  id: cc
  cs_pin: GPIO4
  spi_mode: 0
  data_rate: 1MHz

interval:
  - interval: 250ms
    then:
      - lambda: |-
          // Sample RSSI nearly continuously for ~150 ms, hold the peak.
          float peak = -200.0f;
          uint32_t start = millis();
          while (millis() - start < 150) {
            uint8_t r1=0, r2=0; int t=0;
            do {
              id(cc).enable(); id(cc).transfer_byte(0x34|0xC0); r1=id(cc).transfer_byte(0x00); id(cc).disable();
              id(cc).enable(); id(cc).transfer_byte(0x34|0xC0); r2=id(cc).transfer_byte(0x00); id(cc).disable();
              t++;
            } while (r1!=r2 && t<10);
            float rssi = (r1>=128) ? ((float)(r1-256)/2.0f-74.0f) : ((float)r1/2.0f-74.0f);
            if (rssi > peak) peak = rssi;
            delayMicroseconds(400);
          }
          // Make sure we're still in RX (recover from any FIFO overflow).
          uint8_t m1=0, m2=0; int t=0;
          do {
            id(cc).enable(); id(cc).transfer_byte(0x35|0xC0); m1=id(cc).transfer_byte(0x00); id(cc).disable();
            id(cc).enable(); id(cc).transfer_byte(0x35|0xC0); m2=id(cc).transfer_byte(0x00); id(cc).disable();
            t++;
          } while (m1!=m2 && t<10);
          uint8_t st = m1 & 0x1F;
          if (st != 0x0D) {
            id(cc).enable(); id(cc).transfer_byte(0x36); id(cc).disable(); delayMicroseconds(80);
            id(cc).enable(); id(cc).transfer_byte(0x3A); id(cc).disable(); delayMicroseconds(40);
            id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();
          }
          if (peak > -78.0f)
            ESP_LOGI("rssi", "PEAK=%4.0f dBm   <=========== SIGNAL DETECTED!", peak);
          else
            ESP_LOGI("rssi", "peak=%4.0f dBm  (quiet)", peak);
