# FREQ0 FINDER - the decisive frequency-offset test (per the esphome-elero README:
# "your frequency might have an offset. I had to set my module to 0xc0/0x71/0x21
#  whereas the default is 0x7a/0x71/0x21").
#
# Keeps FREQ2=0x21 and FREQ1=0x71 fixed (like the author) and steps FREQ0 across the
# whole range. At each step it listens ~800ms; if it decodes a REAL Elero packet
# (syst byte == 0x01), it prints the winning FREQ0.
#
# HOW TO RUN: flash, open Logs, then HOLD an Elero remote button DOWN on top of the
# module continuously for ~40 seconds so it keeps transmitting through the whole sweep.
# Watch for:   *** FOUND! FREQ0=0xXX  src=0x...  <=== PUT THIS IN freq0 ***

esphome:
  name: esp-milos
  friendly_name: esp-milos
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(cc).enable(); id(cc).transfer_byte(0x30); id(cc).disable();   // SRES
          delay(5);
          const uint8_t regs[][2] = {
            {0x0B,0x08},{0x0C,0x00},
            {0x0D,0x21},{0x0E,0x71},{0x0F,0x7A},   // FREQ2/1/0 (FREQ0 will be swept)
            {0x10,0x7B},{0x11,0x83},{0x12,0x13},{0x13,0x52},{0x14,0xF8},
            {0x0A,0x00},{0x15,0x43},{0x21,0xB6},{0x22,0x10},
            {0x18,0x18},{0x17,0x3F},{0x19,0x1D},{0x1A,0x1F},
            {0x1B,0xC7},{0x1C,0x00},{0x1D,0xB2},
            {0x23,0xEA},{0x24,0x2A},{0x25,0x00},{0x26,0x1F},
            {0x29,0x59},{0x2C,0x81},{0x2D,0x35},{0x2E,0x09},
            {0x02,0x06},{0x07,0x8C},{0x08,0x45},{0x09,0x00},
            {0x06,0x3C},{0x04,0xD3},{0x05,0x91}
          };
          for (auto &r : regs) {
            id(cc).enable(); id(cc).transfer_byte(r[0]); id(cc).transfer_byte(r[1]); id(cc).disable();
            delayMicroseconds(20);
          }
          id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();   // SRX
          ESP_LOGI("freq", "Sweeping FREQ0. HOLD the remote on the module for ~40s.");

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  interface: software

spi_device:
  id: cc
  cs_pin: GPIO4
  spi_mode: 0
  data_rate: 200kHz

globals:
  - id: f0
    type: uint8_t
    restore_value: false
    initial_value: '0x40'

interval:
  - interval: 850ms
    then:
      - lambda: |-
          // Program the current FREQ0 and (re)enter RX.
          id(cc).enable(); id(cc).transfer_byte(0x36); id(cc).disable(); delayMicroseconds(80);  // SIDLE
          id(cc).enable(); id(cc).transfer_byte(0x3A); id(cc).disable(); delayMicroseconds(40);  // SFRX
          id(cc).enable(); id(cc).transfer_byte(0x0F); id(cc).transfer_byte(id(f0)); id(cc).disable(); delayMicroseconds(20);
          id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();                          // SRX

          // Listen ~700ms at this FREQ0, polling for a decoded packet.
          bool found = false;
          uint32_t start = millis();
          while (millis() - start < 700 && !found) {
            uint8_t b1=0,b2=0; int t=0;
            do {
              id(cc).enable(); id(cc).transfer_byte(0x3B|0xC0); b1=id(cc).transfer_byte(0x00); id(cc).disable();
              id(cc).enable(); id(cc).transfer_byte(0x3B|0xC0); b2=id(cc).transfer_byte(0x00); id(cc).disable();
              t++;
            } while (b1!=b2 && t<10);
            uint8_t n = b1 & 0x7F;
            if (n >= 26 && n <= 40) {
              uint8_t buf[64];
              id(cc).enable();
              id(cc).transfer_byte(0x3F | 0xC0);                       // RX FIFO burst read
              for (uint8_t i = 0; i < n; i++) buf[i] = id(cc).transfer_byte(0x00);
              id(cc).disable();
              if (buf[5] == 0x01) {                                    // syst=0x01 => real Elero packet
                ESP_LOGI("freq", "*** FOUND! FREQ0=0x%02X  len=%d  src=0x%02X%02X%02X  <=== PUT THIS IN freq0 ***",
                         id(f0), buf[0], buf[7], buf[8], buf[9]);
                found = true;
              }
              // flush whatever we read
              id(cc).enable(); id(cc).transfer_byte(0x36); id(cc).disable(); delayMicroseconds(60);
              id(cc).enable(); id(cc).transfer_byte(0x3A); id(cc).disable(); delayMicroseconds(40);
              id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();
            }
            delayMicroseconds(800);
          }
          if (!found)
            ESP_LOGI("freq", "FREQ0=0x%02X : nothing", id(f0));

          // Advance FREQ0 by 0x10 each cycle, wrap from 0xF0 back to 0x00.
          id(f0) = (id(f0) >= 0xF0) ? 0x00 : (uint8_t)(id(f0) + 0x10);
