# RSSI METER - directly tests whether the CC1101 receiver hears the remote.
# Configures the radio for RX (same registers as the elero component) and prints
# live signal strength ~4x/second. RSSI reacts to ANY radio energy in band, so it
# does NOT need a valid packet.
#
# HOW TO READ:
#  - Idle: RSSI sits around -90 to -110 dBm (noise floor).
#  - Press your remote NEXT TO the module: if the receiver works, RSSI jumps up
#    to roughly -20 to -60 dBm for the moment you press.
#  - If RSSI NEVER moves while pressing the remote on top of it -> receiver is dead.

esphome:
  name: esp-milos
  friendly_name: esp-milos
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          // Reset
          id(cc).enable(); id(cc).transfer_byte(0x30); id(cc).disable();
          delay(5);
          // Config registers (addr,value) - same as the elero component init
          const uint8_t regs[][2] = {
            {0x0B,0x08},{0x0C,0x00},
            {0x0D,0x21},{0x0E,0x71},{0x0F,0x7A},   // FREQ2/1/0 (default tuning)
            {0x10,0x7B},{0x11,0x83},{0x12,0x13},{0x13,0x52},{0x14,0xF8},
            {0x0A,0x00},{0x15,0x43},{0x21,0xB6},{0x22,0x10},
            {0x18,0x18},{0x17,0x3F},{0x19,0x1D},{0x1A,0x1F},
            {0x1B,0xC7},{0x1C,0x00},{0x1D,0xB2},
            {0x23,0xEA},{0x24,0x2A},{0x25,0x00},{0x26,0x1F},
            {0x29,0x59},{0x2C,0x81},{0x2D,0x35},{0x2E,0x09},
            {0x02,0x06},{0x07,0x8C},{0x08,0x45},{0x09,0x00},
            {0x06,0x3C},{0x04,0xD3},{0x05,0x91}
          };
          for (auto &r : regs) {
            id(cc).enable();
            id(cc).transfer_byte(r[0]);
            id(cc).transfer_byte(r[1]);
            id(cc).disable();
            delayMicroseconds(20);
          }
          // Enter RX
          id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();
          ESP_LOGI("rssi", "Configured for RX. Watch RSSI; press remote on top of the module.");

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  interface: software

spi_device:
  id: cc
  cs_pin: GPIO4
  spi_mode: 0
  data_rate: 1MHz

interval:
  - interval: 200ms
    then:
      - lambda: |-
          // 1) MARCSTATE (double-read to dodge the status-reg erratum)
          uint8_t m1=0, m2=0; int t=0;
          do {
            id(cc).enable(); id(cc).transfer_byte(0x35|0xC0); m1=id(cc).transfer_byte(0x00); id(cc).disable();
            id(cc).enable(); id(cc).transfer_byte(0x35|0xC0); m2=id(cc).transfer_byte(0x00); id(cc).disable();
            t++;
          } while (m1!=m2 && t<20);
          uint8_t st = m1 & 0x1F;
          // 2) keep the radio in RX; flush the FIFO if it has overflowed
          if (st == 0x11) {                                   // RXFIFO_OVERFLOW
            id(cc).enable(); id(cc).transfer_byte(0x36); id(cc).disable(); delayMicroseconds(100); // SIDLE
            id(cc).enable(); id(cc).transfer_byte(0x3A); id(cc).disable(); delayMicroseconds(50);  // SFRX
            id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();                          // SRX
          } else if (st != 0x0D) {                            // not in RX
            id(cc).enable(); id(cc).transfer_byte(0x34); id(cc).disable();                          // SRX
          }
          // 3) RSSI (double-read)
          uint8_t r1=0, r2=0; t=0;
          do {
            id(cc).enable(); id(cc).transfer_byte(0x34|0xC0); r1=id(cc).transfer_byte(0x00); id(cc).disable();
            id(cc).enable(); id(cc).transfer_byte(0x34|0xC0); r2=id(cc).transfer_byte(0x00); id(cc).disable();
            t++;
          } while (r1!=r2 && t<20);
          float rssi = (r1 >= 128) ? ((float)(r1-256)/2.0f - 74.0f) : ((float)r1/2.0f - 74.0f);
          // 4) FREQEST - the chip's own estimate of the frequency error (double-read)
          uint8_t e1=0, e2=0; t=0;
          do {
            id(cc).enable(); id(cc).transfer_byte(0x32|0xC0); e1=id(cc).transfer_byte(0x00); id(cc).disable();
            id(cc).enable(); id(cc).transfer_byte(0x32|0xC0); e2=id(cc).transfer_byte(0x00); id(cc).disable();
            t++;
          } while (e1!=e2 && t<20);
          int8_t foff = (int8_t)e1;
          float khz = foff * 1.587f;   // each FREQEST step ~= 1.587 kHz
          // Only the FREQEST captured WHILE a strong signal is present is meaningful
          if (rssi > -55.0f)
            ESP_LOGI("rssi", "RSSI=%4.0f dBm  st=0x%02X  FREQEST=%+d (%+.0f kHz)  <== SIGNAL", rssi, st, foff, khz);
          else
            ESP_LOGI("rssi", "RSSI=%4.0f dBm  st=0x%02X", rssi, st);
